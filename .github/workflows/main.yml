name: Build Tachistoscop 3.0 Alpha APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Tachistoscop/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate source tree
        run: |
          test -f "Tachistoscop/settings.gradle.kts"
          test -f "Tachistoscop/app/build.gradle.kts"
          test -f "Tachistoscop/app/src/main/java/ro/tachistoscop/app/MainActivity.java"
          test -f "Tachistoscop/app/src/main/java/ro/tachistoscop/app/StimulusGenerator.java"
          test -f "Tachistoscop/app/src/main/java/ro/tachistoscop/app/RecallScorer.java"
          test -f "Tachistoscop/app/src/main/java/ro/tachistoscop/app/FrameExposureController.java"
          grep -q 'versionName = "3.0.0-alpha1"' Tachistoscop/app/build.gradle.kts
          echo "Tachistoscop 3.0 alpha source validated."

      - name: Build debug APK
        working-directory: ./Tachistoscop
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Compute APK checksum
        run: |
          sha256sum Tachistoscop/app/build/outputs/apk/debug/app-debug.apk \
            > Tachistoscop/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Tachistoscop-3.0-Alpha-APK
          path: |
            Tachistoscop/app/build/outputs/apk/debug/app-debug.apk
            Tachistoscop/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
