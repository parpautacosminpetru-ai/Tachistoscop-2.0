name: Build Tachistoscop Pro 2.1 Final APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Tachistoscop Pro 2.1
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "Tachistoscop_Android_Project_v2.1.zip" -d extracted

          test -f "extracted/Tachistoscop/settings.gradle.kts"
          test -f "extracted/Tachistoscop/app/build.gradle.kts"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/MainActivity.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/PlacementTestActivity.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/PlacementEngine.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/PlacementProfileStore.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/SemanticItemRepository.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/BookTextLayoutEngine.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/MasteryGate.java"
          test -f "extracted/Tachistoscop/app/src/main/java/ro/tachistoscop/app/PlannerActivity.java"

          grep -q 'versionName = "2.1.0"' extracted/Tachistoscop/app/build.gradle.kts
          grep -q 'versionCode = 30' extracted/Tachistoscop/app/build.gradle.kts
          echo "Tachistoscop Pro 2.1 final extracted and validated."

      - name: Build debug APK
        working-directory: ./extracted/Tachistoscop
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Compute APK checksum
        run: |
          sha256sum extracted/Tachistoscop/app/build/outputs/apk/debug/app-debug.apk \
            > extracted/Tachistoscop/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Tachistoscop-Pro-2.1-Final-APK
          path: |
            extracted/Tachistoscop/app/build/outputs/apk/debug/app-debug.apk
            extracted/Tachistoscop/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
